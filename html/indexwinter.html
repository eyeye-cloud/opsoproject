<!DOCTYPE html>
<html lang="ko">
<head>
<div class="container">
        <link rel="stylesheet" href="../css/stylewinter.css"> 
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Italiana&display=swap" rel="stylesheet">
        <div class="header">           
            <h1>Spring Films</h1>
            <p class="subtitle">
                # 긴 겨울을 지나온 네게, 고요한 온기가 눈처럼 내려앉는 시간<br>
            </p>
            <div class="movie-line1"></div>
            <div class="movie-line2"></div>
            <div class="perforation-container left" id="perf-left"></div>
            <div class="perforation-container right" id="perf-right"></div>
            <div class="button">
                <button id="prev-btn" class="prev-btn">«</button>
                <button id="next-btn" class="next-btn">»</button>
            </div> 
        </div>
</head>
<body>
        <div class="track-container" id="track-container">
            <div class="film-strip" id="track-amber">
                <div class="film-content">
                    <div class="film-grid">
                        <div class="film-image">
                            <img src="../asset/썸네일%20아카이브/snowman.jpg" alt="snowman">
                            <div class="film-overlay"></div>
                        </div>
                        
                        <div class="film-text amber">
                            <div>
                                <p class="track-label amber">TRACK 01</p>
                                <p class="artist-name">Sia</p>
                                <h2 class="song-title amber">Snowman</h2>
                            </div>

                            <div class="quote-box amber">
                                <p class="quote-line">돌담에 속삭이는 햇발같이</p>
                                <p class="quote-line">풀 아래 웃음 짓는 샘물같이</p>
                                <p class="quote-line">나는 너를 사랑해야겠다</p>
                                <p class="quote-line">너를 언제나 고이 지키는 마음으로</p>
                            </div>

                            <div class="timestamp amber">
                                <p class="timestamp-text">DEVELOPED: 2024 • KODAK PORTRA 400</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="film-strip" id="track-rose">
                <div class="film-perforations film-perforations-left" id="perf2left"></div>
                <div class="film-perforations film-perforations-right" id="perf2right"></div>
                
                <div class="film-content">
                    <div class="film-grid" style="direction: rtl;">
                        <div style="direction: ltr;">
                            <div class="film-text rose">
                                <div>
                                    <p class="track-label rose">
                                        <br>
                                        <br>
                                        <br>
                                        TRACK 02</p>
                                    <p class="artist-name">The Beatles</p>
                                    <h2 class="song-title rose">Let it be</h2>
                                </div>

                                <div class="quote-box rose">
                                    <p class="quote-line">가는 배를</p>
                                    <p class="quote-line">붙들 수도 없어</p>
                                    <p class="quote-line">물결에 맡겨</p>
                                    <p class="quote-line">그냥 보내노라</p>
                                </div>

                                <div class="timestamp rose">
                                    <p class="timestamp-text">DEVELOPED: 2024 • FUJIFILM SUPERIA 400</p>
                                </div>
                            </div>
                        </div>

                        <div class="film-image" style="direction: ltr;">
                            <img src="../asset/썸네일%20아카이브/let it be.jpg" alt="let it be">
                            <div class="film-overlay"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

<script>
        function createPerforations() {
            const containers = [
                { left: 'perf-left', right: 'perf-right' }
            ];

            containers.forEach(({ left, right }) => {
                [left, right].forEach(id => {
                    const container = document.getElementById(id);
                    container.innerHTML = '';
                    for (let i = 0; i < 8; i++) {
                        const hole = document.createElement('div');
                        hole.className = 'perforation-hole';
                        container.appendChild(hole);
                    }
                });
            });
        }
</script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    createPerforations(); 

    const trackContainer = document.getElementById('track-container'); 
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');

    let currentTrack = 1; 
    const totalTracks = 2; 

    function updateTrackDisplay() {
        const offset = (currentTrack - 1) * -50; 
        trackContainer.style.transform = `translateX(${offset}%)`;

        prevBtn.disabled = (currentTrack === 1);
        nextBtn.disabled = (currentTrack === totalTracks);
    }

    nextBtn.addEventListener('click', function() {
        if (currentTrack < totalTracks) {
            currentTrack++;
            updateTrackDisplay();
        }
    });

    prevBtn.addEventListener('click', function() {
        if (currentTrack > 1) {
            currentTrack--;
            updateTrackDisplay();
        }
    });

    updateTrackDisplay();
    setTimeout(() => {
        document.body.classList.add('loaded');
    }, 10);
});
</script>
