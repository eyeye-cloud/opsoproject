<script> //구현한 기능은 봄 세부 페이지와 동일함. 전반적으로 AI가 구현하였음.
var tag = document.createElement('script');
tag.src = "https://www.youtube.com/iframe_api";
document.head.appendChild(tag);

let players = {};
let currentPlayingId = null;

const trackData = {
    'player-track-1': 'MEqHS1bybMQ', //김예인: 각 노래에 해당하는 아이디 삽입함.
    'player-track-2': 'Xu56OVkwdXw'
};

function onYouTubeIframeAPIReady() {
    const hiddenContainer = document.createElement('div');
    hiddenContainer.id = 'youtube-hidden-container';
    hiddenContainer.style.display = 'none';
    document.body.appendChild(hiddenContainer);

    Object.keys(trackData).forEach(id =>{
        const div = document.createElement('div');
        div.id = `youtube-player-iframe-${id}`;
        hiddenContainer.appendChild(div);

        players[id] = new YT.Player(div.id, {
            videoId: trackData[id],
            playerVars:{playsinline:1,controls:0,rel:0},
            events:{onStateChange:onPlayerStateChange}
        })
    });
}

function onPlayerStateChange(event) {
    const id = event.target.getIframe().id.replace("youtube-player-iframe-","");
    const btn = document.querySelector(`#${id} .play-btn`);
    if(!btn) return;

    btn.innerHTML = event.data===YT.PlayerState.PLAYING ? "❚❚" : "▶";

    if(event.data===YT.PlayerState.PLAYING){
        updateProgressBar(id); 
    }
}

function updateProgressBar(id){
    const player = players[id];
    const bar = document.querySelector(`#${id} .timeline`);
    const currentEl = document.querySelector(`#${id} .current-time`);
    const totalEl = document.querySelector(`#${id} .total-time`);

    if(!bar || !player) return;

    const duration = player.getDuration();
    const current = player.getCurrentTime();
    const percent = (current / duration) * 100;   

    currentEl.textContent = formatTime(current);
    totalEl.textContent = formatTime(duration);

    bar.value = percent;
    bar.style.setProperty('--progress', `${percent}%`);

    if(player.getPlayerState() === YT.PlayerState.PLAYING){
        requestAnimationFrame(()=>updateProgressBar(id));
    }
}

function formatTime(sec){
    sec = Math.floor(sec);
    let m = Math.floor(sec / 60);
    let s = sec % 60;
    return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function togglePlay(id){
    const p = players[id];
    if(!p) return;

    if(currentPlayingId && currentPlayingId!==id){
        players[currentPlayingId].pauseVideo();
    }

    if(p.getPlayerState()===1) p.pauseVideo();
    else {
        p.playVideo();
        updateProgressBar(id); 
    }

    currentPlayingId=id;
}

document.addEventListener("click", e=>{
    const btn=e.target.closest(".play-btn");
    if(!btn) return;
    const parent=btn.closest(".absolute");
    if(parent) togglePlay(parent.id);
});

document.addEventListener("input", e=>{
    const bar=e.target.closest(".timeline");
    if(!bar) return;

    const parent = bar.closest(".absolute").id;
    const player = players[parent];
    const duration = player.getDuration();
    const seekTime = (bar.value/100)*duration;

    player.seekTo(seekTime,true);
});

function fadeIn(player, duration = 400) { 
    let vol = 0;
    player.setVolume(0);
    const step = 100 / (duration / 20);

    const fade = setInterval(() => {
        vol += step;
        if (vol >= 100) {
            player.setVolume(100);
            clearInterval(fade);
        } else player.setVolume(vol);
    }, 20);
}

function fadeOut(player, duration = 400) {
    let vol = 100;
    const step = 100 / (duration / 20);

    const fade = setInterval(() => {
        vol -= step;
        if(vol <= 0){
            player.setVolume(0);
            clearInterval(fade);
            player.pauseVideo(); 
        } else player.setVolume(vol);
    },20);
}

let userSeeking = false;

document.addEventListener("mousedown", e=>{
    const bar=e.target.closest(".timeline");
    if(!bar) return;

    userSeeking = true;
    if(currentPlayingId && players[currentPlayingId]){
        fadeOut(players[currentPlayingId],200); 
    }
});

document.addEventListener("input", e=>{
    const bar=e.target.closest(".timeline");
    if(!bar) return;

    const parent=bar.closest(".absolute").id;
    const player=players[parent];
    const duration=player.getDuration();
    player.seekTo((bar.value/100)*duration,true);
});

document.addEventListener("mouseup", e=>{
    if(!userSeeking) return;
    userSeeking=false;

    const bar=e.target.closest(".timeline");
    if(!bar) return;

    const parent=bar.closest(".absolute").id;
    const player=players[parent];

    player.playVideo();     
    fadeIn(player,400); 
});
</script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    createPerforations(); 

    const trackContainer = document.getElementById('track-container'); 
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');

    let currentTrack = 1;
    const totalTracks = 2;

    const initialOffset = (currentTrack - 1) * -50;
    trackContainer.style.transform = `translateX(${initialOffset}%)`;
    trackContainer.style.opacity = '1';

    function updateTrackDisplay() {
        const offset = (currentTrack - 1) * -50; 
        trackContainer.style.transform = `translateX(${offset}%)`;

        prevBtn.disabled = (currentTrack === 1);
        nextBtn.disabled = (currentTrack === totalTracks);

        const subtitle = document.querySelector(".subtitle");
        if(currentTrack === 1){
            subtitle.classList.remove("green-theme");
            subtitle.classList.add("red-theme");
        } else {
            subtitle.classList.remove("red-theme");
            subtitle.classList.add("green-theme");
        }
        
        if (currentPlayingId && players[currentPlayingId]) {
            players[currentPlayingId].pauseVideo();
            currentPlayingId = null;
        }
    }

    nextBtn.addEventListener('click', function() {
        if (currentTrack < totalTracks) {
            currentTrack++;
            updateTrackDisplay();
        }
    });

    prevBtn.addEventListener('click', function() {
        if (currentTrack > 1) {
            currentTrack--;
            updateTrackDisplay();
        }
    });

    prevBtn.disabled = (currentTrack === 1);
    nextBtn.disabled = (currentTrack === totalTracks);

    setTimeout(() => {
        document.body.classList.add('loaded');
    }, 20);
});

        function createPerforations() {
            const containers = [
                { left: 'perf-left', right: 'perf-right' }
            ];

            containers.forEach(({ left, right }) => {
                [left, right].forEach(id => {
                    const container = document.getElementById(id);
                    container.innerHTML = '';
                    for (let i = 0; i < 8; i++) {
                        const hole = document.createElement('div');
                        hole.className = 'perforation-hole';
                        container.appendChild(hole);
                    }
                });
            });
        }
document.getElementById('home-btn').addEventListener('click', () => {
    window.location.href = 'https://eyeye-cloud.github.io/opsoproject/';
});
</script>
