<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나만의 힐링송 – 사계절 뷰어</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 환영 화면 (스크롤 parallax) -->
  <div id="welcomeScreen">
    <h1>사계</h1>
    <div class="arrow">↓</div>
  </div>

  <!-- 메인 4분할 뷰 -->
  <div id="mainScreen">
    <div class="season-grid">
      <!-- 봄 -->
      <button class="season-tile spring" data-season="spring">
        <div class="tile-overlay"></div>
        <div class="tile-content">
          <h2>봄</h2>
          <div class="tile-desc">벚꽃</div>
          <div class="tile-theme">미숙함, 어색함과 새로움</div>
        </div>
        <div class="tile-icon">🌸</div>
      </button>
      <!-- 여름 -->
      <button class="season-tile summer" data-season="summer">
        <div class="tile-overlay"></div>
        <div class="tile-content">
          <h2>여름</h2>
          <div class="tile-desc">바다</div>
          <div class="tile-theme">일상과 연결, 일상의 안정</div>
        </div>
        <div class="tile-icon">🌊</div>
      </button>
      <!-- 가을 -->
      <button class="season-tile autumn" data-season="autumn">
        <div class="tile-overlay"></div>
        <div class="tile-content">
          <h2>가을</h2>
          <div class="tile-desc">단풍, 낙엽</div>
          <div class="tile-theme">과거에 대한 회상, 감성</div>
        </div>
        <div class="tile-icon">🍂</div>
      </button>
      <!-- 겨울 -->
      <button class="season-tile winter" data-season="winter">
        <div class="tile-overlay"></div>
        <div class="tile-content">
          <h2>겨울</h2>
          <div class="tile-desc">눈, 소나무</div>
          <div class="tile-theme">유난히 길었던 겨울, 스스로에 대한 위로</div>
        </div>
        <div class="tile-icon">❄️</div>
      </button>
    </div>
  </div>

  <!-- 계절별 상세 뷰 (초기 숨김) -->
  <div id="seasonDetailScreen">
    <header class="detail-header">
      <button class="back-btn" id="backBtn">← 돌아가기</button>
      <h1 id="seasonTitle"></h1>
      <div class="season-desc" id="seasonDesc"></div>
    </header>
    <main class="detail-main">
      <section class="season-detail" id="seasonSection"></section>
    </main>
  </div>

  <script src="detail.js"></script>
</body>
</html>
